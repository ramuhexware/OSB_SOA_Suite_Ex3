server.port=8081
spring.application.name=loan-service

spring.datasource.url=jdbc:h2:mem:loandb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Custom configurations for dependent service endpoints
service.credit.url=http://localhost:8082/api/credit
service.valuation.url=http://localhost:8083/api/valuation
service.underwriting.url=http://localhost:8084/api/underwriting
service.disbursement.url=http://localhost:8085/api/disbursement
service.notification.url=http://localhost:8086/api/notification
